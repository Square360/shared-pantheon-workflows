<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="420" viewBox="0 0 1320 420" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <!-- RC multidev flow — shared-workflows v4.7.0+ : route-smoke gates the OWASP scan -->
  <!-- Edit freely: each node is a <g id="..."> with one rect + icon + label. -->
  <style>
    .bg    { fill: #0d1117; }
    .box   { fill: #161b22; stroke: #30363d; stroke-width: 1.5; rx: 8; }
    .gate  { fill: #161b22; stroke: #d29922; stroke-width: 2; rx: 8; }
    .lbl   { fill: #e6edf3; font-size: 15px; }
    .sub   { fill: #8b949e; font-size: 12.5px; }
    .title { fill: #e6edf3; font-size: 18px; font-weight: 600; }
    .edge  { stroke: #3d444d; stroke-width: 2; fill: none; }
    .edgeG { stroke: #d29922; stroke-width: 2.5; fill: none; }
    .ok    { fill: #3fb950; }
  </style>

  <rect class="bg" x="0" y="0" width="1320" height="420"/>
  <text class="title" x="24" y="38">RC Multidev — merge to develop</text>
  <text class="sub" x="24" y="60">The RC is the first build of the merged aggregate. Route-smoke certifies it serves its routes; only then does the security scan run.</text>

  <g id="deploy-rc">
    <rect class="box" x="24" y="110" width="290" height="72"/>
    <circle class="ok" cx="48" cy="136" r="8"/><path d="M44 136 l3 3 l6 -6" stroke="#0d1117" stroke-width="2.2" fill="none"/>
    <text class="lbl" x="64" y="140">Deploy to RC Multidev</text>
    <text class="sub" x="64" y="162">rc-YYYY-WW · this cycle's PRs, merged</text>
  </g>

  <g id="route-smoke-gate">
    <rect class="gate" x="420" y="110" width="330" height="72"/>
    <circle class="ok" cx="444" cy="136" r="8"/><path d="M440 136 l3 3 l6 -6" stroke="#0d1117" stroke-width="2.2" fill="none"/>
    <text class="lbl" x="460" y="140">Route Smoke — aggregate gate</text>
    <text class="sub" x="460" y="162">authenticated sweep of key routes on the RC</text>
  </g>

  <g id="owasp">
    <rect class="box" x="860" y="110" width="330" height="72"/>
    <circle class="ok" cx="884" cy="136" r="8"/><path d="M880 136 l3 3 l6 -6" stroke="#0d1117" stroke-width="2.2" fill="none"/>
    <text class="lbl" x="900" y="140">OWASP ZAP Security Scan</text>
    <text class="sub" x="900" y="162">strict on rc-* — runs only after routes pass</text>
  </g>

  <g id="notify-slack">
    <rect class="box" x="420" y="230" width="330" height="46"/>
    <circle class="ok" cx="444" cy="253" r="8"/><path d="M440 253 l3 3 l6 -6" stroke="#0d1117" stroke-width="2.2" fill="none"/>
    <text class="lbl" x="460" y="258">Notify Slack</text>
  </g>

  <g id="vrt">
    <rect class="box" x="420" y="300" width="330" height="46"/>
    <circle class="ok" cx="444" cy="323" r="8"/><path d="M440 323 l3 3 l6 -6" stroke="#0d1117" stroke-width="2.2" fill="none"/>
    <text class="lbl" x="460" y="328">Visual Regression Test</text>
  </g>

  <!-- edges -->
  <path class="edge"  d="M314 146 C 366 146, 368 146, 420 146"/>
  <path class="edgeG" d="M750 146 C 804 146, 806 146, 860 146"/>
  <path class="edge"  d="M314 168 C 372 168, 362 253, 420 253"/>
  <path class="edge"  d="M314 176 C 378 176, 356 323, 420 323"/>

  <!-- gate note -->
  <text class="sub" x="770" y="205" fill="#d29922">needs: route_smoke — skipped counts as pass, failure blocks</text>

  <!-- legend -->
  <g id="legend">
    <rect class="gate" x="24" y="360" width="18" height="18"/>
    <text class="sub" x="52" y="374">gold border = the gate (run_route_smoke input, default on)</text>
  </g>
</svg>
