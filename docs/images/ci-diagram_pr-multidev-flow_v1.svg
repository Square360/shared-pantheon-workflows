<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="560" viewBox="0 0 1320 560" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <!-- PR multidev flow — shared-workflows v4.8.0 (deploy-multidev.yml on: pull_request) -->
  <!-- Edit freely: each node is a <g id="..."> with one rect + icon + label. -->
  <style>
    .bg    { fill: #0d1117; }
    .box   { fill: #161b22; stroke: #30363d; stroke-width: 1.5; rx: 8; }
    .group { fill: #10151c; stroke: #30363d; stroke-width: 1.5; stroke-dasharray: 6 4; rx: 10; }
    .lbl   { fill: #e6edf3; font-size: 15px; }
    .sub   { fill: #8b949e; font-size: 12.5px; }
    .title { fill: #e6edf3; font-size: 18px; font-weight: 600; }
    .edge  { stroke: #3d444d; stroke-width: 2; fill: none; }
    .ok    { fill: #3fb950; }
    .skip  { fill: #6e7681; }
  </style>

  <rect class="bg" x="0" y="0" width="1320" height="560"/>
  <text class="title" x="24" y="38">Deploy to Pantheon Multi-Dev — pull_request</text>
  <text class="sub" x="24" y="60">shared-workflows @v4 (v4.8.0) — php-quality and route-smoke built into the PR multidev flow</text>

  <!-- left column: repo-local checks -->
  <g id="composer-diff">
    <rect class="box" x="24" y="96" width="250" height="46"/>
    <circle class="ok" cx="48" cy="119" r="8"/><path d="M44 119 l3 3 l6 -6" stroke="#0d1117" stroke-width="2.2" fill="none"/>
    <text class="lbl" x="64" y="124">Composer Diff Comment</text>
  </g>
  <g id="composer-audit">
    <rect class="box" x="24" y="156" width="250" height="46"/>
    <circle class="ok" cx="48" cy="179" r="8"/><path d="M44 179 l3 3 l6 -6" stroke="#0d1117" stroke-width="2.2" fill="none"/>
    <text class="lbl" x="64" y="184">Composer Security Audit</text>
  </g>
  <g id="static-tests">
    <rect class="box" x="24" y="216" width="250" height="46"/>
    <circle class="ok" cx="48" cy="239" r="8"/><path d="M44 239 l3 3 l6 -6" stroke="#0d1117" stroke-width="2.2" fill="none"/>
    <text class="lbl" x="64" y="244">Run Static Tests</text>
  </g>

  <!-- reusable group: everything below arrives from shared-workflows @v4 -->
  <rect class="group" x="330" y="86" width="960" height="440"/>
  <text class="sub" x="350" y="112">Deploy to PR Multidev — reusable-pantheon-deploy-pr-multidev @v4</text>

  <g id="php-quality">
    <rect class="box" x="360" y="132" width="270" height="62"/>
    <circle class="ok" cx="384" cy="155" r="8"/><path d="M380 155 l3 3 l6 -6" stroke="#0d1117" stroke-width="2.2" fill="none"/>
    <text class="lbl" x="400" y="159">PHP Quality</text>
    <text class="sub" x="400" y="180">class-load + custom unit suites (runner)</text>
  </g>

  <g id="deploy">
    <rect class="box" x="360" y="220" width="270" height="62"/>
    <circle class="ok" cx="384" cy="243" r="8"/><path d="M380 243 l3 3 l6 -6" stroke="#0d1117" stroke-width="2.2" fill="none"/>
    <text class="lbl" x="400" y="247">Deploy to PR Multidev</text>
    <text class="sub" x="400" y="268">builds pr-N on Pantheon, drush deploy</text>
  </g>

  <g id="route-smoke">
    <rect class="box" x="700" y="220" width="270" height="62"/>
    <circle class="ok" cx="724" cy="243" r="8"/><path d="M720 243 l3 3 l6 -6" stroke="#0d1117" stroke-width="2.2" fill="none"/>
    <text class="lbl" x="740" y="247">Route Smoke</text>
    <text class="sub" x="740" y="268">authenticated key-route sweep (drush uli)</text>
  </g>

  <g id="notify-slack">
    <rect class="box" x="700" y="310" width="270" height="46"/>
    <circle class="ok" cx="724" cy="333" r="8"/><path d="M720 333 l3 3 l6 -6" stroke="#0d1117" stroke-width="2.2" fill="none"/>
    <text class="lbl" x="740" y="338">Notify Slack</text>
  </g>

  <g id="security-optin">
    <rect class="box" x="700" y="380" width="270" height="46"/>
    <circle class="skip" cx="724" cy="403" r="8"/>
    <text class="lbl" x="740" y="408" fill="#8b949e">Security Scan (opt-in label)</text>
  </g>

  <g id="vrt-optin">
    <rect class="box" x="700" y="450" width="270" height="46"/>
    <circle class="skip" cx="724" cy="473" r="8"/>
    <text class="lbl" x="740" y="478" fill="#8b949e">Visual Regression (opt-in label)</text>
  </g>

  <!-- edges -->
  <path class="edge" d="M630 251 C 665 251, 665 251, 700 251"/>
  <path class="edge" d="M630 262 C 668 262, 662 333, 700 333"/>
  <path class="edge" d="M630 270 C 672 270, 658 403, 700 403"/>
  <path class="edge" d="M630 276 C 676 276, 654 473, 700 473"/>

  <!-- legend -->
  <g id="legend">
    <circle class="ok" cx="1040" cy="150" r="8"/><text class="sub" x="1056" y="155">passed</text>
    <circle class="skip" cx="1130" cy="150" r="8"/><text class="sub" x="1146" y="155">skipped / opt-in</text>
  </g>
</svg>
