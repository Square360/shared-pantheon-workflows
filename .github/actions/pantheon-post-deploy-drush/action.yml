name: 'Pantheon post-deploy Drush commands'
description: 'Runs `drush deploy` (updatedb → cache:rebuild → config:import → cache:rebuild → deploy:hook), forces maintenance mode off, then flushes the Pantheon edge cache. Honors [verbose] PR-title flag for -v on drush deploy. Requires Terminus to already be installed and authenticated.'

inputs:
  site:
    description: 'Pantheon site machine name'
    required: true
  env:
    description: 'Pantheon environment name (e.g. dev, pr-22, rc-2026-21, epr-757)'
    required: true
  machine_token:
    description: 'Pantheon machine token (required for terminus drush). Pass from caller-side secrets.PANTHEON_MACHINE_TOKEN.'
    required: true
  skip:
    description: 'If "true", skip running drush commands entirely. Pass the workflow_skip_terminus input through.'
    required: false
    default: 'false'
  pr_title:
    description: 'PR title (for [verbose] flag detection). Leave empty for non-PR triggers — the flag will not match and default flags apply.'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    # Pantheon's own signal for "code is deployed to the env's containers" is
    # the platform workflow (Sync code / Create Multidev / Converge) that the
    # git push kicked off. Gate on it first: wait until no workflow on the
    # target env is still running. This absorbs the bulk of the settle time
    # deterministically — however long Pantheon's queue takes is exactly how
    # long we wait — instead of guessing with fixed sleeps. We gate on
    # "any running workflow for this env" rather than name-matching
    # descriptions ("Sync code on ..."), which Pantheon can reword; the cost
    # is an occasional wait on an overlapping automated backup (~2min, rare).
    # Soft-fail on timeout, consistent with the probes below — the probes and
    # the drush-deploy retry backstop still stand behind this gate.
    - name: Wait for Pantheon platform workflows on the env to finish
      if: ${{ inputs.skip != 'true' }}
      shell: bash
      env:
        TERMINUS_MACHINE_TOKEN: ${{ inputs.machine_token }}
        SITE: ${{ inputs.site }}
        ENV: ${{ inputs.env }}
      run: |
        echo "Waiting for Pantheon workflows on ${SITE}.${ENV} to finish..."
        MAX_ATTEMPTS=60
        for i in $(seq 1 ${MAX_ATTEMPTS}); do
          # Count workflows for this env still in "running". Coerce jq/terminus
          # failures to empty (not 0) so a transient API error keeps polling
          # instead of passing the gate on bad data.
          RUNNING=$(terminus workflow:list "${SITE}" --format=json 2>/dev/null \
            | jq -r --arg env "${ENV}" \
              '[.[] | select(.env == $env and .status == "running")] | length' \
            2>/dev/null || true)
          if [ "${RUNNING}" = "0" ]; then
            echo "✅ No running Pantheon workflows on ${SITE}.${ENV} (attempt ${i})"
            # Surface (don't fail on) a failed most-recent workflow: the push
            # itself was already verified by pantheon-push's ls-remote check,
            # and the probes below will catch an env that's actually broken.
            LAST_STATUS=$(terminus workflow:list "${SITE}" --format=json 2>/dev/null \
              | jq -r --arg env "${ENV}" \
                '[.[] | select(.env == $env)] | sort_by(.started_at) | last | .status // empty' \
              2>/dev/null || true)
            if [ "${LAST_STATUS}" = "failed" ]; then
              echo "::warning::Most recent Pantheon workflow on ${SITE}.${ENV} reports 'failed'; relying on bootstrap/code-sync probes to validate the env"
            fi
            break
          fi
          if [ "$i" -eq "${MAX_ATTEMPTS}" ]; then
            echo "::warning::Timed out (~10min) waiting for Pantheon workflows on ${SITE}.${ENV} to finish (running: ${RUNNING:-unknown}); proceeding to probes"
            break
          fi
          echo "  attempt ${i}/${MAX_ATTEMPTS}: ${RUNNING:-?} workflow(s) still running — sleeping 10s..."
          sleep 10
        done

    # After git-pushing a fresh build artifact to Pantheon, the new vendor/
    # and web/core/ trees take seconds-to-minutes to propagate to the env's
    # application container filesystem. If drush runs too early it bootstraps
    # against a partial tree and dies — either during shutdown (lazy-loaded
    # hook classes missing) or during the command itself (Drupal Kernel
    # init can't find web/core/lib/Drupal/Core/Render/HtmlResponse.php etc.).
    #
    # Probe with `drush ev '\Drupal::VERSION'` — it exercises the full Drupal
    # bootstrap path (Kernel + autoload + core includes), same as updb/cim.
    # Lighter probes like `core:status` can pass while web/core/* is still
    # syncing, especially on freshly-created multidevs (PR/RC/epic).
    - name: Wait for Pantheon env filesystem to settle after code push
      if: ${{ inputs.skip != 'true' }}
      shell: bash
      env:
        TERMINUS_MACHINE_TOKEN: ${{ inputs.machine_token }}
        SITE: ${{ inputs.site }}
        ENV: ${{ inputs.env }}
      run: |
        echo "Waiting for ${SITE}.${ENV} to settle after code push (full Drupal bootstrap probe)..."
        MAX_ATTEMPTS=180
        for i in $(seq 1 ${MAX_ATTEMPTS}); do
          if terminus -n drush "${SITE}.${ENV}" -- ev 'echo \Drupal::VERSION;' >/dev/null 2>&1; then
            echo "✅ ${SITE}.${ENV} drush+Drupal bootstrap is ready (attempt ${i})"
            break
          fi
          if [ "$i" -eq "${MAX_ATTEMPTS}" ]; then
            echo "::warning::Timed out after ${MAX_ATTEMPTS} attempts (~6min) waiting for Drupal bootstrap on ${SITE}.${ENV}; proceeding anyway"
            break
          fi
          sleep 2
        done

    # The bootstrap probe above proves Drupal ANSWERS, not that it answers
    # from the commit this job pushed — an env still serving the previous
    # artifact bootstraps happily, drush deploy runs config:import against
    # the OLD config/sync tree, and the deploy reports success having
    # imported nothing (observed on a client epic multidev, 2026-07-11 —
    # a 5,600-line views change sat at "config:status: Different" after a
    # green deploy). Close that race: poll the env's git HEAD until it
    # matches the artifact commit this job pushed — the same runner-HEAD
    # SHA the pantheon-push verify step confirmed via ls-remote, now
    # checked on the application container filesystem.
    #
    # HEAD alone isn't enough: the ref can flip while vendor/ and web/core/
    # files are still landing on the container, which is exactly the window
    # where drush deploy dies on lazy-loaded classes (symfony/console
    # ConsoleErrorEvent etc.). So also require a clean `git status
    # --porcelain` — in git mode the code tree is clean at rest, so any
    # dirt (modified/deleted paths, rsync temp files) means the sync is
    # still in flight. Soft-fail on timeout, consistent with the bootstrap
    # probe: a real push failure already failed the workflow back in
    # pantheon-push.
    - name: Wait for the pushed commit to reach the env filesystem
      if: ${{ inputs.skip != 'true' }}
      shell: bash
      env:
        TERMINUS_MACHINE_TOKEN: ${{ inputs.machine_token }}
        SITE: ${{ inputs.site }}
        ENV: ${{ inputs.env }}
      run: |
        EXPECTED=$(git rev-parse HEAD 2>/dev/null || true)
        if [ -z "${EXPECTED}" ]; then
          echo "::warning::Runner workspace is not a git checkout; skipping code-sync wait"
          exit 0
        fi
        echo "Waiting for ${SITE}.${ENV} filesystem to reach ${EXPECTED} with a clean tree..."
        MAX_ATTEMPTS=72
        for i in $(seq 1 ${MAX_ATTEMPTS}); do
          PROBE=$(terminus -n drush "${SITE}.${ENV}" -- ev 'echo shell_exec("git rev-parse HEAD; git status --porcelain | wc -l");' 2>/dev/null || true)
          DEPLOYED=$(echo "${PROBE}" | sed -n 1p | tr -d '[:space:]')
          DIRTY=$(echo "${PROBE}" | sed -n 2p | tr -d '[:space:]')
          if [ "${DEPLOYED}" = "${EXPECTED}" ] && [ "${DIRTY}" = "0" ]; then
            echo "✅ ${SITE}.${ENV} is serving ${EXPECTED} with a clean tree (attempt ${i})"
            break
          fi
          if [ "$i" -eq "${MAX_ATTEMPTS}" ]; then
            echo "::warning::Timed out (~6min) waiting for ${SITE}.${ENV} to reach ${EXPECTED} with a clean tree (filesystem shows ${DEPLOYED:-unreadable}, dirty paths: ${DIRTY:-unreadable}); proceeding — drush deploy may run against stale or partial code"
            break
          fi
          sleep 5
        done

    # Third distinct failure mode: the network files mount (public://) coming
    # online late on freshly-created multidevs. PhpStorage lives under the
    # files mount on Pantheon, so cache:rebuild inside drush deploy hits
    # "mkdir(): Permission denied" if the mount isn't writable yet — a
    # different subsystem from code sync, invisible to both probes above.
    # Probe it directly: write-then-delete a 1-byte dotfile in public://.
    # temporary:// would probe the container-local /tmp and prove nothing
    # about the mount. Soft-fail on timeout like the other gates.
    - name: Wait for the env files mount to be writable
      if: ${{ inputs.skip != 'true' }}
      shell: bash
      env:
        TERMINUS_MACHINE_TOKEN: ${{ inputs.machine_token }}
        SITE: ${{ inputs.site }}
        ENV: ${{ inputs.env }}
      run: |
        echo "Waiting for ${SITE}.${ENV} public:// files mount to be writable..."
        MAX_ATTEMPTS=72
        for i in $(seq 1 ${MAX_ATTEMPTS}); do
          RESULT=$(terminus -n drush "${SITE}.${ENV}" -- ev '$f = "public://.settle-probe"; if (@file_put_contents($f, "x") === FALSE) { echo "WRITE-FAIL"; } else { @unlink($f); echo "WRITE-OK"; }' 2>/dev/null || true)
          if [ "${RESULT}" = "WRITE-OK" ]; then
            echo "✅ ${SITE}.${ENV} files mount is writable (attempt ${i})"
            break
          fi
          if [ "$i" -eq "${MAX_ATTEMPTS}" ]; then
            echo "::warning::Timed out (~6min) waiting for ${SITE}.${ENV} files mount to be writable (probe: ${RESULT:-no output}); proceeding — cache:rebuild may hit PhpStorage permission errors"
            break
          fi
          sleep 5
        done

    - name: Run drush deploy
      if: ${{ inputs.skip != 'true' }}
      shell: bash
      env:
        TERMINUS_MACHINE_TOKEN: ${{ inputs.machine_token }}
        PR_TITLE: ${{ inputs.pr_title }}
        SITE: ${{ inputs.site }}
        ENV: ${{ inputs.env }}
      run: |
        # `drush deploy` runs the canonical sequence:
        #   1. updatedb --no-cache-clear   (hook_update_N)
        #   2. cache:rebuild               (container sees updb's schema/state)
        #   3. config:import               (new config imports against fresh container)
        #   4. cache:rebuild               (next request sees imported config)
        #   5. deploy:hook                 (hook_deploy_NAME — data work that needs new config)
        # Data migrations that depend on imported config belong in MODULE.deploy.php
        # (hook_deploy_NAME), not hook_update_N. See Drush docs: drush.org/deploycommand
        DEPLOY_FLAGS="-y"
        if [[ "$PR_TITLE" == *"[verbose]"* ]]; then
          echo "🔍 Verbose deploy enabled (detected [verbose] tag)"
          DEPLOY_FLAGS="-y -v"
        fi

        # The gates above (platform workflows finished, Drupal bootstraps,
        # pushed commit present with a clean tree, files mount writable)
        # cover every settling failure mode we've observed, so retries here
        # should now be rare — a firing retry is a signal that a gate missed
        # something and is worth investigating, not routine noise. Kept as a
        # backstop with progressive backoff: 30s → 60s → 180s (4 attempts,
        # ~4.5min worst-case wait). `drush deploy` and `env:clear-cache` are
        # both idempotent so retrying is safe even if an attempt partially
        # succeeded — drush deploy's sub-commands (updb, cr, cim,
        # deploy:hook) are each individually idempotent.
        retry_drush() {
          local cmd_desc="$1"
          shift
          local backoffs=(30 60 180)
          local max_attempts=$((${#backoffs[@]} + 1))
          for i in $(seq 1 $max_attempts); do
            if "$@"; then
              [ "$i" -gt 1 ] && echo "✅ ${cmd_desc} succeeded on attempt ${i}"
              return 0
            fi
            if [ "$i" -lt "$max_attempts" ]; then
              local wait="${backoffs[$((i-1))]}"
              echo "::warning::${cmd_desc} failed on attempt ${i}; waiting ${wait}s before retry..."
              sleep "$wait"
            fi
          done
          echo "::error::${cmd_desc} failed after ${max_attempts} attempts"
          return 1
        }

        echo "🚀 Running drush deploy (updb → cr → cim → cr → deploy:hook)"
        retry_drush "drush deploy" terminus -n drush "${SITE}.${ENV}" -- deploy $DEPLOY_FLAGS

        # Belt-and-braces: drush deploy can leave the site in maintenance
        # mode if an update hook or deploy hook enabled it (or if the caller
        # workflow set it pre-deploy and crashed before unsetting). Force
        # it off and rebuild caches so the maintenance state propagates.
        # state:set is idempotent — safe to retry.
        echo "🔓 Forcing maintenance mode off"
        retry_drush "maintenance_mode off" terminus -n drush "${SITE}.${ENV}" -- state:set system.maintenance_mode 0 --input-format=integer -y
        retry_drush "cache:rebuild" terminus -n drush "${SITE}.${ENV}" -- cache:rebuild

        # drush deploy's internal cache:rebuild clears Drupal's container
        # cache but not Pantheon's edge/CDN cache. Flush it so users see
        # the deployed code on the next request.
        retry_drush "env:clear-cache" terminus -n env:clear-cache "${SITE}.${ENV}"
