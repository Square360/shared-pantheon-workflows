name: Reusable PHP Quality (plugin class-load + unit tests)

# -----------------------------------------------------------------------------
# Static quality gate for Drupal repos — no database, no Pantheon, no deploy.
#
# Two checks, both cheap:
#
#   1. Plugin class-load check (always runs when web/modules/custom exists).
#      Maps every class under web/modules/custom/**/src/Plugin (and src/Hook)
#      via Drupal's PSR-4 convention and class-loads each one through the
#      composer autoloader plus a module/theme namespace map built from the
#      checked-out tree. A contrib update that adds parameter/return types to
#      a base-class method is a hard PHP compile fatal in every custom subclass
#      with the old signature — invisible in watchdog and invisible on a green
#      multidev unless review exercised the plugin-instantiation path. This
#      check fails the PR that introduces the mismatch, with the exact PHP
#      error. (Origin: som.yale.edu /admin/content outage, 2026-08-18 — VBO
#      4.4.5→4.4.7 typed executeMultiple(); custom action fataled on LIVE.)
#
#   2. Unit tests (conditional; skip-don't-fail).
#      Runs the custom modules' PHPUnit *Unit* suites only — no Kernel or
#      Functional (those need a database and are a separate, heavier stage).
#      Gates, each producing a visible "skipped" notice instead of a failure:
#        - at least one web/modules/custom/*/tests/src/Unit directory exists
#        - vendor/bin/phpunit is installed (repo carries drupal/core-dev or
#          phpunit in require-dev, and composer_no_dev is false)
#      The skip annotation is deliberate: the workflow rolls out portfolio-wide
#      immediately, and coverage grows repo-by-repo as tests land (CDI SOP).
#
# Composer note: the class-load check works with --no-dev (contrib base
# classes are prod deps). Unit tests need dev deps; set composer_no_dev: false
# (the default) on repos that carry tests.
# -----------------------------------------------------------------------------

on:
  workflow_call:
    inputs:
      php_version:
        description: 'PHP version to run checks under (match production)'
        required: false
        type: string
        default: '8.3'
      composer_no_dev:
        description: 'Install without dev dependencies (class-load check only; unit tests will skip)'
        required: false
        type: boolean
        default: false
      scan_paths:
        description: 'Space-separated roots to class-load (relative to repo root)'
        required: false
        type: string
        default: 'web/modules/custom'
      exclude_classes:
        description: 'Space-separated fully-qualified class names to skip (optional-dependency subclasses)'
        required: false
        type: string
        default: ''

jobs:
  php-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ inputs.php_version }}
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Composer install
        run: |
          if [ "${{ inputs.composer_no_dev }}" = "true" ]; then
            composer install --no-dev --optimize-autoloader --no-interaction --no-progress
          else
            composer install --optimize-autoloader --no-interaction --no-progress
          fi

      - name: Plugin class-load check
        run: |
          if [ ! -d web/modules/custom ]; then
            echo "::notice::plugin class-load check skipped: no web/modules/custom directory"
            exit 0
          fi
          cat > /tmp/plugin-class-load-check.php <<'PHP'
          <?php
          // Class-loads every custom plugin class. A typed-signature mismatch
          // against a (possibly just-bumped) base class is a PHP compile fatal:
          // the shutdown handler names the class that was loading when it died.
          $autoload = require 'vendor/autoload.php';

          // Drupal only autoloads module namespaces at runtime — register a
          // PSR-4 map for every extension in the tree (contrib + custom +
          // profiles + themes) so parent classes resolve.
          foreach (['web/core/modules', 'web/modules', 'web/profiles', 'web/themes'] as $root) {
            if (!is_dir($root)) { continue; }
            $it = new RecursiveIteratorIterator(new RecursiveDirectoryIterator($root, FilesystemIterator::SKIP_DOTS));
            foreach ($it as $f) {
              if (substr($f->getFilename(), -9) === '.info.yml' && substr_count($f->getFilename(), '.') === 2) {
                $dir = $f->getPath();
                $name = substr($f->getFilename(), 0, -9);
                if (is_dir("$dir/src")) {
                  $autoload->addPsr4("Drupal\\$name\\", "$dir/src");
                }
              }
            }
          }

          $scan_roots = array_filter(explode(' ', $argv[1] ?? 'web/modules/custom'));
          $exclude = array_filter(explode(' ', $argv[2] ?? ''));
          $current = NULL;
          register_shutdown_function(function () use (&$current) {
            $e = error_get_last();
            if ($e && $current && in_array($e['type'], [E_ERROR, E_COMPILE_ERROR], TRUE)) {
              fwrite(STDERR, "\n::error::class-load FAILED for $current\n::error::{$e['message']}\n");
            }
          });

          $checked = 0;
          $failures = 0;
          foreach ($scan_roots as $root) {
            if (!is_dir($root)) { continue; }
            $it = new RecursiveIteratorIterator(new RecursiveDirectoryIterator($root, FilesystemIterator::SKIP_DOTS));
            foreach ($it as $f) {
              $path = $f->getPathname();
              // Only classes under a module's src/Plugin or src/Hook — the
              // runtime-instantiated surfaces where a latent fatal hides.
              if (!preg_match('#/src/(Plugin|Hook)/.*\.php$#', $path)) { continue; }
              if (!preg_match('#(^|/)([a-z0-9_]+)/src/(.+)\.php$#', $path, $m)) { continue; }
              $class = 'Drupal\\' . $m[2] . '\\' . str_replace('/', '\\', $m[3]);
              if (in_array($class, $exclude, TRUE)) { continue; }
              $current = $class;
              try {
                // Signature incompatibility is an uncatchable compile fatal —
                // the shutdown handler reports it. Catchable Errors (a parent
                // class genuinely absent, bad interface) report and continue.
                class_exists($class, TRUE) || interface_exists($class, TRUE) || trait_exists($class, TRUE);
              }
              catch (\Throwable $e) {
                fwrite(STDERR, "::error::class-load FAILED for $class — {$e->getMessage()}\n");
                $failures++;
              }
              $checked++;
            }
          }
          $current = NULL;
          if ($failures) {
            fwrite(STDERR, "::error::$failures of $checked plugin classes failed to load\n");
            exit(1);
          }
          echo "class-loaded $checked plugin classes clean\n";
          PHP
          php /tmp/plugin-class-load-check.php "${{ inputs.scan_paths }}" "${{ inputs.exclude_classes }}"

      - name: Unit tests (custom modules)
        if: ${{ !inputs.composer_no_dev }}
        run: |
          UNIT_DIRS=$(find web/modules/custom -type d -path '*/tests/src/Unit' 2>/dev/null || true)
          if [ -z "$UNIT_DIRS" ]; then
            echo "::notice::unit tests skipped: no web/modules/custom/*/tests/src/Unit directories"
            exit 0
          fi
          if [ ! -x vendor/bin/phpunit ]; then
            echo "::notice::unit tests skipped: vendor/bin/phpunit not installed (add drupal/core-dev to require-dev)"
            exit 0
          fi
          # Custom Unit suites only — no Kernel/Functional (they need a DB).
          # PHPUnit >=9 accepts a single path argument — run once per module.
          FAIL=0
          while IFS= read -r dir; do
            echo "── $dir"
            vendor/bin/phpunit -c web/core "$dir" || FAIL=1
          done <<< "$UNIT_DIRS"
          exit $FAIL

      - name: Unit tests skipped (no-dev install)
        if: ${{ inputs.composer_no_dev }}
        run: |
          echo "::notice::unit tests skipped: composer_no_dev is true (dev dependencies not installed)"
